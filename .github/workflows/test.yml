name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  NODE_VERSION: "22"
jobs:
  codex-review-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test .github/codex/*.test.cjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web bundle that the Go binary embeds
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: ./api/check-generated.sh
      - run: go vet ./...
      - run: go test -race ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/lib/api.generated.ts
      - run: npm run lint
      - run: npm test
      - name: Disable unused Google Chrome apt repository
        # Playwright downloads its own Chromium. A stale Chrome apt index can
        # otherwise block installation of Ubuntu's browser system dependencies.
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify headed browser startup, display security, sizing and persistence
        working-directory: .
        env:
          TED_BROWSER_INTEGRATION: "1"
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
          # Let sandboxed Chrome create user namespaces on this ephemeral runner.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          CHROME=$(node -p "require('./web/node_modules/playwright').chromium.executablePath()")
          mkdir -p "$RUNNER_TEMP/ted-browser-bin"
          ln -s "$CHROME" "$RUNNER_TEMP/ted-browser-bin/chromium"
          export PATH="$RUNNER_TEMP/ted-browser-bin:$PATH"
          export TED_BROWSER_HEADED_TEST_EXECUTABLE="$CHROME"
          unset DISPLAY
          go test -race ./browser -run '^(TestBrowserModePersistenceIntegration|TestHeadedViewportIntegration|TestHeadedDisplayXvfbIntegration|TestHeadedChromeExitReleasesDisplayIntegration)$' -count=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-test-artifacts
          path: web/test-results
